<body>
<div id="root"></div>
<script type="text/babel">
/* ── tweaks-panel.jsx (inlined) ── */
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}

    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}

    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);
  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };
  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}
function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}
function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value} onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}
function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'} onClick={onClick}>{label}</button>
  );
}
</script>

          <>
            <p style={{ fontSize: 18, fontWeight: 800, color: S.text, marginBottom: 4 }}>다시 만나서 반가워요! 🐶</p>
            <p style={{ fontSize: 13, color: S.sub, marginBottom: 24 }}>로그인하고 반려동물과 함께해요.</p>
            <Field label="아이디 (이메일)">
              <input value={id} onChange={e => setId(e.target.value)} placeholder="ppomi@email.com" style={inputStyle} />
            </Field>
            <Field label="비밀번호">
              <input value={pw} onChange={e => setPw(e.target.value)} type="password" placeholder="비밀번호를 입력해 주세요" style={inputStyle} />
            </Field>
            <button onClick={() => { setLoggedIn(true); setUserName(nickname || '뽀미 보호자'); }}
              style={{
                marginTop: 8, width: '100%', height: 56, borderRadius: buttonRadius,
                background: `linear-gradient(135deg, ${primaryColor}, #FFB84D)`,
                border: 'none', cursor: 'pointer', color: '#fff', fontSize: 17, fontWeight: 700,
                fontFamily: 'inherit', boxShadow: `0 8px 24px ${primaryColor}44`,
              }}>로그인</button>
            <p style={{ textAlign: 'center', fontSize: 13, color: S.sub, marginTop: 16 }}>
              아직 계정이 없으신가요?{' '}
              <span onClick={() => setMode('signup')} style={{ color: primaryColor, fontWeight: 700, cursor: 'pointer' }}>회원가입</span>
            </p>
          </>
        ) : (
          <>
            <p style={{ fontSize: 18, fontWeight: 800, color: S.text, marginBottom: 4 }}>뽀시래기 가입하기 🎉</p>
            <p style={{ fontSize: 13, color: S.sub, marginBottom: 24 }}>반려동물과 함께하는 여정을 시작해요.</p>
            <Field label="닉네임">
              <input value={nickname} onChange={e => setNickname(e.target.value)} placeholder="예: 뽀미 보호자" style={inputStyle} />
            </Field>
            <Field label="아이디 (이메일)">
              <input value={id} onChange={e => setId(e.target.value)} placeholder="ppomi@email.com" style={inputStyle} />
            </Field>
            <Field label="비밀번호">
              <input value={pw} onChange={e => setPw(e.target.value)} type="password" placeholder="8자 이상 입력해 주세요" style={inputStyle} />
            </Field>
            <Field label="비밀번호 확인">
              <input value={pwConfirm} onChange={e => setPwConfirm(e.target.value)} type="password" placeholder="비밀번호를 한 번 더 입력해 주세요" style={inputStyle} />
              {pwConfirm && pw !== pwConfirm && (
                <p style={{ fontSize: 11, color: S.danger, marginTop: 4 }}>비밀번호가 일치하지 않아요.</p>
              )}
              {pwConfirm && pw === pwConfirm && pw.length >= 8 && (
                <p style={{ fontSize: 11, color: accentColor, marginTop: 4 }}>✓ 비밀번호가 일치해요.</p>
              )}
            </Field>
            <button onClick={() => { if (pw === pwConfirm && pw.length >= 8) { setLoggedIn(true); setUserName(nickname); } }}
              style={{
                marginTop: 8, width: '100%', height: 56, borderRadius: buttonRadius,
                background: (pw === pwConfirm && pw.length >= 8 && nickname) ? `linear-gradient(135deg, ${primaryColor}, #FFB84D)` : S.border,
                border: 'none', cursor: 'pointer',
                color: (pw === pwConfirm && pw.length >= 8 && nickname) ? '#fff' : S.light,
                fontSize: 17, fontWeight: 700, fontFamily: 'inherit',
                boxShadow: (pw === pwConfirm && pw.length >= 8 && nickname) ? `0 8px 24px ${primaryColor}44` : 'none',
              }}>가입 완료</button>
            <p style={{ textAlign: 'center', fontSize: 13, color: S.sub, marginTop: 16 }}>
              이미 계정이 있으신가요?{' '}
              <span onClick={() => setMode('login')} style={{ color: primaryColor, fontWeight: 700, cursor: 'pointer' }}>로그인</span>
            </p>
          </>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   WALK SCREENS
═══════════════════════════════════════ */
const WALK_WAYPOINTS = [
  [30,135],[58,112],[82,92],[112,100],[145,125],
  [172,118],[198,92],[225,70],[252,82],[278,102],
  [305,118],[328,106],[350,88]
];

function WalkScreen({ onStart }) {
  const { primaryColor, cardRadius } = useT();
  const sampleWalks = [
    { date: '5월 2일 (금)', time: '오후 5:30', duration: '32분', distance: '2.4', emoji: '☀️' },
    { date: '4월 30일 (수)', time: '오전 8:15', duration: '25분', distance: '1.8', emoji: '🌤️' },
    { date: '4월 28일 (월)', time: '오후 6:00', duration: '41분', distance: '3.1', emoji: '⛅' },
  ];
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: S.bg }}>

        <div style={{
          background: `linear-gradient(135deg, ${primaryColor}, #FFB84D)`,

        }}>
          <div style={{ fontSize: 12, opacity: 0.85, marginBottom: 10, fontWeight: 600 }}>이번 달 · 5월</div>
          <div style={{ display: 'flex', gap: 28 }}>
            {[['3','회'],['7.3','km'],['33','분 평균']].map(([val, unit]) => (
              <div key={unit}>
                <div style={{ fontSize: 30, fontWeight: 800, lineHeight: 1 }}>{val}</div>
                <div style={{ fontSize: 11, opacity: 0.75, marginTop: 3 }}>{unit}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div style={{ flex: 1, overflow: 'auto', padding: '16px 20px 108px' }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: S.sub, marginBottom: 10 }}>최근 산책</div>
        {sampleWalks.map((w, i) => (
          <div key={i} style={{
            background: '#fff', borderRadius: cardRadius,

            <div style={{

            }}>{w.emoji}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: S.text }}>
                {w.date} <span style={{ color: S.sub, fontWeight: 500, fontSize: 12 }}>{w.time}</span>
              </div>
              <div style={{ fontSize: 13, color: S.sub, marginTop: 3 }}>{w.distance}km · {w.duration}</div>
            </div>
            <Chevron />
          </div>

      </div>
      <div style={{ position: 'absolute', bottom: 90, left: 20, right: 20 }}>

  );
}

function WalkActiveScreen({ onStop }) {
  const [elapsed, setElapsed] = React.useState(0);
  const [isPaused, setIsPaused] = React.useState(false);

  React.useEffect(() => {
    if (isPaused) return;
    const id = setInterval(() => setElapsed(e => e + 1), 1000);
    return () => clearInterval(id);
  }, [isPaused]);

  const dist = parseFloat((elapsed * 0.003).toFixed(2));
  const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const secs = String(elapsed % 60).padStart(2, '0');
  const paceText = dist > 0
    ? (() => { const p = (elapsed / 60) / dist; return `${Math.floor(p)}'${String(Math.round((p % 1) * 60)).padStart(2, '0')}`; })()
    : "--'--";
  const dotIdx = Math.min(Math.floor(elapsed / 15), WALK_WAYPOINTS.length - 1);
  const dot = WALK_WAYPOINTS[dotIdx];
  const activePoints = WALK_WAYPOINTS.slice(0, dotIdx + 1).map(p => p.join(',')).join(' ');
  const fullPoints = WALK_WAYPOINTS.map(p => p.join(',')).join(' ');

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#080B14' }}>
      <div style={{ padding: '14px 20px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: 13, color: 'rgba(255,255,255,0.45)', fontWeight: 600 }}>산책 중 · 뽀미</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <div style={{ width: 7, height: 7, borderRadius: 4, background: '#6DB56D', boxShadow: '0 0 6px #6DB56D' }} />
          <span style={{ fontSize: 12, color: '#6DB56D', fontWeight: 600 }}>GPS 연결됨</span>
        </div>
      </div>

      <div style={{ textAlign: 'center', padding: '16px 0 8px' }}>
        <div style={{
          fontSize: 72, fontWeight: 800, color: '#fff',
          letterSpacing: -2, lineHeight: 1, fontVariantNumeric: 'tabular-nums',
        }}>{mins}:{secs}</div>
        <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.35)', marginTop: 6 }}>경과 시간</div>
      </div>

      <div style={{ display: 'flex', padding: '0 24px', marginBottom: 10 }}>
        {[{ val: dist.toFixed(2), unit: 'km' }, { val: paceText, unit: '분/km' }].map(({ val, unit }, i) => (
          <React.Fragment key={unit}>
            {i > 0 && <div style={{ width: 1, background: 'rgba(255,255,255,0.08)', margin: '4px 0' }} />}
            <div style={{ flex: 1, textAlign: 'center' }}>
              <div style={{ fontSize: 34, fontWeight: 800, color: '#fff', fontVariantNumeric: 'tabular-nums' }}>{val}</div>
              <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)' }}>{unit}</div>
            </div>
          </React.Fragment>
        ))}
      </div>

      <div style={{ flex: 1, margin: '0 16px', borderRadius: 20, background: '#0F1628', overflow: 'hidden' }}>
        <svg width="100%" height="100%" viewBox="0 0 380 170" preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
          <line x1="0" y1="85" x2="380" y2="85" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
          <line x1="190" y1="0" x2="190" y2="170" stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
          <polyline points={fullPoints} stroke="rgba(255,255,255,0.07)" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          {dotIdx > 0 && (
            <polyline points={activePoints} stroke="#F5A623" strokeWidth="3.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          )}
          <circle cx={WALK_WAYPOINTS[0][0]} cy={WALK_WAYPOINTS[0][1]} r="5" fill="#6DB56D"/>
          <circle cx={dot[0]} cy={dot[1]} r="10" fill="#F5A62330"/>
          <circle cx={dot[0]} cy={dot[1]} r="6" fill="#F5A623" stroke="#fff" strokeWidth="1.5"/>
        </svg>
      </div>

      <div style={{ padding: '14px 16px 18px', display: 'flex', gap: 10, alignItems: 'center' }}>
        <button style={{
          width: 50, height: 50, borderRadius: 25,
          background: 'rgba(255,255,255,0.08)', border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <Camera size={20} />
        </button>
        <button onClick={() => setIsPaused(p => !p)} style={{
          flex: 1, height: 52, borderRadius: 26,
          background: 'rgba(255,255,255,0.10)', border: 'none', cursor: 'pointer',
          color: '#fff', fontSize: 15, fontWeight: 700, fontFamily: 'inherit',
        }}>
          {isPaused ? '▶  재개' : '⏸  일시정지'}
        </button>
        <button onClick={() => onStop({ elapsed, distance: dist })} style={{
          width: 52, height: 52, borderRadius: 26,
          background: '#F5A623', border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 4px 16px #F5A62366',
        }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="3" width="12" height="12" rx="3" fill="white"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

function WalkResultScreen({ result, onSave, onDiscard }) {
  const { primaryColor, cardRadius } = useT();
  const [memo, setMemo] = React.useState('');
  const { elapsed = 0, distance = 0 } = result || {};
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  const pace = distance > 0 ? (elapsed / 60) / distance : 0;
  const paceMin = Math.floor(pace);
  const paceSec = Math.round((pace % 1) * 60);

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: S.bg }}>
      <div style={{ flex: 1, overflow: 'auto', padding: '20px 20px 108px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
          <div style={{
            width: 44, height: 44, borderRadius: 22,
            background: `${primaryColor}22`,
            display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22,
          }}>🐾</div>
          <div>
            <div style={{ fontSize: 20, fontWeight: 800, color: S.text }}>산책 완료!</div>
            <div style={{ fontSize: 13, color: S.sub }}>5월 3일 · 오늘</div>
          </div>
        </div>

        <div style={{ background: '#fff', borderRadius: cardRadius, padding: 20, marginBottom: 14, boxShadow: '0 2px 12px rgba(0,0,0,0.07)' }}>
          <div style={{ display: 'flex', textAlign: 'center' }}>
            {[
              { val: distance.toFixed(2), unit: 'km', color: primaryColor },
              { val: `${mins}:${String(secs).padStart(2,'0')}`, unit: '시간', color: S.text },
              { val: `${paceMin}'${String(paceSec).padStart(2,'0')}`, unit: '분/km', color: S.text },
            ].map(({ val, unit, color }, i) => (
              <React.Fragment key={unit}>
                {i > 0 && <div style={{ width: 1, background: S.border, margin: '0 4px' }} />}
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 26, fontWeight: 800, color }}>{val}</div>
                  <div style={{ fontSize: 11, color: S.sub, marginTop: 3 }}>{unit}</div>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>

        <div style={{ background: '#0F1628', borderRadius: cardRadius, overflow: 'hidden', marginBottom: 14, height: 130 }}>
          <svg width="100%" height="130" viewBox="0 0 380 130" preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
            <polyline
              points="30,105 58,82 82,62 112,70 145,95 172,88 198,62 225,40 252,52 278,72 305,88 328,76 350,58"
              stroke="#F5A623" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"
            />
            <circle cx="30" cy="105" r="5" fill="#6DB56D"/>
            <circle cx="350" cy="58" r="5" fill="#F5A623" stroke="#fff" strokeWidth="1.5"/>
            <text x="36" y="109" fill="rgba(255,255,255,0.4)" fontSize="9">출발</text>
            <text x="320" y="53" fill="rgba(255,255,255,0.4)" fontSize="9">도착</text>
          </svg>
        </div>

        <div style={{ background: '#fff', borderRadius: cardRadius, padding: '14px 16px', boxShadow: '0 2px 8px rgba(0,0,0,0.06)' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: S.sub, marginBottom: 8 }}>메모</div>
          <textarea
            value={memo}
            onChange={e => setMemo(e.target.value)}
            placeholder="오늘 산책은 어땠나요? 🐾"
            style={{
              width: '100%', height: 80, border: 'none', resize: 'none',
              fontSize: 14, color: S.text, fontFamily: 'inherit',
              outline: 'none', background: 'transparent', boxSizing: 'border-box',
            }}
          />
        </div>
      </div>

      <div style={{ position: 'absolute', bottom: 90, left: 20, right: 20, display: 'flex', gap: 10 }}>
        <button onClick={onDiscard} style={{
          height: 52, padding: '0 20px', borderRadius: 14,
          background: S.border, border: 'none', cursor: 'pointer',
          fontSize: 14, fontWeight: 600, color: S.sub, fontFamily: 'inherit',
        }}>삭제</button>
        <button onClick={() => onSave(memo)} style={{
          flex: 1, height: 52, borderRadius: 14,
          background: `linear-gradient(135deg, ${primaryColor}, #FFB84D)`,
          border: 'none', cursor: 'pointer',
          color: '#fff', fontSize: 15, fontWeight: 700, fontFamily: 'inherit',
          boxShadow: `0 6px 20px ${primaryColor}44`,
        }}>저장하기</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   ROOT APP
═══════════════════════════════════════ */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState('survey');
  const [tab, setTab] = React.useState('home');
  const [walkResult, setWalkResult] = React.useState(null);

  const isOnboarding = ['survey','recommend','profile'].includes(screen);
  const isFullScreen = screen === 'walk_active';

  const handleTab = (t) => {
    setTab(t);
    const map = { home: 'home', care: 'care', walk: 'walk', diary: 'diary', mypage: 'mypage' };
    setScreen(map[t] || 'home');
  };

  const renderScreen = () => {
    if (screen === 'survey') return <SurveyScreen onNext={() => setScreen('recommend')} />;
    if (screen === 'recommend') return <RecommendScreen onNext={() => setScreen('profile')} />;
    if (screen === 'profile') return <PetProfileScreen onNext={() => { setScreen('home'); setTab('home'); }} onBack={() => setScreen('recommend')} />;
    if (screen === 'home') return <HomeScreen />;
    if (screen === 'care') return <CareScreen />;
    if (screen === 'diary') return <DiaryScreen />;
    if (screen === 'walk') return <WalkScreen onStart={() => setScreen('walk_active')} />;
    if (screen === 'walk_active') return <WalkActiveScreen onStop={(res) => { setWalkResult(res); setScreen('walk_result'); }} />;
    if (screen === 'walk_result') return <WalkResultScreen result={walkResult} onSave={() => { setScreen('walk'); setTab('walk'); }} onDiscard={() => { setScreen('walk'); setTab('walk'); }} />;
    if (screen === 'pets') return <PetListScreen onAdd={() => setScreen('profile_from_pets')} onBack={() => { setScreen('mypage'); setTab('mypage'); }} />;
    if (screen === 'profile_from_pets') return <PetProfileScreen onNext={() => { setScreen('pets'); setTab('pet'); }} onBack={() => { setScreen('pets'); setTab('pet'); }} />;
    if (screen === 'mypage') return <MyPageScreen onAddPet={() => { setScreen('profile_from_pets'); }} onViewPets={() => { setScreen('pets'); }} />;
    return <HomeScreen />;
  };

  return (
    <ThemeCtx.Provider value={tweaks}>
      <IOSDevice width={393} height={852} dark={screen === 'walk_active'}>
        {renderScreen()}
        {!isOnboarding && !isFullScreen && <TabBar active={tab} onChange={handleTab} />}
      </IOSDevice>

      {/* Onboarding dots */}
      {isOnboarding && (
        <div style={{
          position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)',
          display: 'flex', gap: 8, alignItems: 'center',
        }}>
          {['survey','recommend','profile'].map(s => (
            <button key={s} onClick={() => setScreen(s)} style={{
              width: s === screen ? 22 : 8, height: 8,
              borderRadius: 4, border: 'none', cursor: 'pointer',
              background: s === screen ? tweaks.primaryColor : 'rgba(255,255,255,0.45)',
              padding: 0, transition: 'all 0.25s',
            }} />
          ))}
        </div>
      )}

      {/* Tweaks panel */}
      <TweaksPanel>
        <TweakSection label="컬러" />
        <TweakColor label="Primary 컬러" value={tweaks.primaryColor} onChange={v => setTweak('primaryColor', v)} />
        <TweakColor label="Accent 컬러" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakSection label="모양" />
        <TweakSlider label="카드 모서리" value={tweaks.cardRadius} min={8} max={28} step={2} onChange={v => setTweak('cardRadius', v)} />
        <TweakSlider label="버튼 모서리" value={tweaks.buttonRadius} min={8} max={28} step={2} onChange={v => setTweak('buttonRadius', v)} />
        <TweakSection label="화면 이동" />
        <TweakButton label="① 설문 화면" onClick={() => setScreen('survey')} />
        <TweakButton label="② 추천 결과" onClick={() => setScreen('recommend')} />
        <TweakButton label="③ 프로필 등록" onClick={() => setScreen('profile')} />
        <TweakButton label="④ 홈 대시보드" onClick={() => { setScreen('home'); setTab('home'); }} />
        <TweakButton label="⑤ 케어 관리" onClick={() => { setScreen('care'); setTab('care'); }} />
        <TweakButton label="⑥ 사진 다이어리" onClick={() => { setScreen('diary'); setTab('diary'); }} />
        <TweakButton label="⑦ 산책 기록" onClick={() => { setScreen('walk'); setTab('walk'); }} />
        <TweakButton label="⑧ 산책 중 (라이브)" onClick={() => { setScreen('walk_active'); setTab('walk'); }} />
        <TweakButton label="⑨ 산책 결과" onClick={() => { setWalkResult({ elapsed: 1980, distance: 2.4 }); setScreen('walk_result'); setTab('walk'); }} />
        <TweakButton label="⑩ 반려동물 목록" onClick={() => setScreen('pets')} />
        <TweakButton label="⑪ 마이페이지" onClick={() => { setScreen('mypage'); setTab('mypage'); }} />
      </TweaksPanel>
    </ThemeCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
